# Mergify of specs/150-host-hermes: merge only when the per-change gate
# (`test`) passed (F150-FR-043; PT-150-043).
pull_request_rules:
  - name: require the gate before merge
    conditions:
      - "check-success=test"
      - "-draft"
    actions:
      merge:
        method: merge

  # Automerge fallback (operator request: EVERY PR to main merges
  # automatically): merges any non-draft PR to main regardless of check
  # state, so a PR never stalls — including on this mirror where Actions
  # runs may not execute. The rule above handles the green-gate path; merge
  # conflicts still block (Mergify cannot merge them) and draft PRs stay
  # for a person.
  - name: automerge every PR to main
    conditions:
      - "base=main"
      - "-draft"
    actions:
      merge:
        method: merge
